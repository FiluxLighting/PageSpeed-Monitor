name: PageSpeed Monitor

on:
  # Ejecución automática: lunes a las 8:00 UTC (ajusta el cron a tu conveniencia)
  schedule:
    - cron: "0 8 * * 1"

  # Ejecución manual desde la pestaña Actions de GitHub
  workflow_dispatch:

permissions:
  contents: write  # Necesario para hacer commit del CSV y el HTML

jobs:
  pagespeed:
    name: Run PageSpeed Insights
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar PageSpeed Monitor
        env:
          # Configura este secreto en: Settings > Secrets and variables > Actions
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: python3 scripts/run_pagespeed.py

      - name: Commit histórico y reporte
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.csv data/latest_audits.json reports/report.html
          git diff --staged --quiet || git commit -m "chore: actualizar métricas PageSpeed [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git push

      # Opcional: publicar el report.html como GitHub Pages (descomenta si usas Pages)
      # - name: Deploy a GitHub Pages
      #   uses: actions/upload-pages-artifact@v3
      #   with:
      #     path: reports/
